[workspace]
resolver = "2"
members = [
    "reweave-core",
    "reweave-macro",
    "reweave-tangle",
    "reweave-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Gianni Ferrarotti <gianni.ferrarotti@gmail.com>"]
license = "0BSD OR MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
memchr = "2"
miette = { version = "7", features = ["fancy"] }
monty = { git = "https://github.com/pydantic/monty", tag = "v0.0.21" }
monty-types = { git = "https://github.com/pydantic/monty", tag = "v0.0.21" }
# NOTE: monty v0.0.21 pulls in ruff_python_ast 0.0.3, which breaks with
# get-size2 >= 0.10.1 (its GetSize impl moved to compact_str 0.10 while
# ruff_python_ast still uses compact_str 0.9). After any `cargo update`,
# re-pin with: cargo update -p get-size2 --precise 0.10.0
pretty_assertions = "1.4"
regex = "1.13"
tempfile = "3.27"
thiserror = "2.0"
walkdir = "2"

reweave-core = { path = "reweave-core" }
reweave-macro = { path = "reweave-macro" }
reweave-tangle = { path = "reweave-tangle" }
